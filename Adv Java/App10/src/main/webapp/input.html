<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<center>
   <form action="dis" method=post><h2>
   <table>
   <tr>
   <td>
   Name
   </td>
   <td>
   <input type="text" name="tname" value="">
   </td></tr>
   <tr>
   <td>
   Age
   </td>
   <td>
   <input type="text" name="tage" value="">
   </td></tr>
   <tr>
   <td>
   Gender
   </td>

   <tr>
   <td>
   Address

  <textarea name="taddress" rows="4" cols="20">Enter address</textarea>

   <tr>

   <td><input type="radio" name="ms" value="Single" />UnMarried</td>
   </tr>
    <tr>
    <td>Qualification</td>

    <select name="qlfy">
     <option value="B.Tech">Engg</option>

     <option value="B.A"> Arts</option>
    </select>
    </td></tr>
    <tr>
    <td>Courses</td>

    <select name="crs" size="3" multiple="multiple">

     <option value=".net" > .NET </option>
     <option value="Testing"> Testing</option>
    </select>
    </td></tr>
    
    <tr>

    <input type="checkbox" name="hb" value="read" checked/>Reading
    <input type="checkbox" name="hb" value="e-sports"/> OnlineGaming
    <input type="checkbox" name="hb" value="travel"/>Travelling

    </tr>
    <tr>

    <input type="submit" value="submit">
    <input type="reset" value="cancel">
    </td>
    </tr>
   </table></h2>
   </form>

</html>
