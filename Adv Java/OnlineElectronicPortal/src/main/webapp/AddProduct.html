<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Add Product</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="addpro.css">

</head>
<body>

<div class="topbar">
    <h2>Add New Product</h2>
    <div class="actions">
        <a href="AdminHome.jsp" class="btn secondary">Dashboard</a>
        <a href="logout" class="btn danger">Logout</a>
    </div>
</div>

<div class="container">

    <div class="card">
        <form action="aps" method="post">

            <div class="input-group">
                <label>Product Code</label>
                <input type="text" name="pcode" required>
            </div>

            <div class="input-group">
                <label>Product Name</label>
                <input type="text" name="pname" required>
            </div>

            <div class="input-group">
                <label>Product Company</label>
                <input type="text" name="pcomp" required>
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Price</label>
                    <input type="number" name="pprice" required>
                </div>

                <div class="input-group">
                    <label>Quantity</label>
                    <input type="number" name="pqty" required>
                </div>
            </div>

            <button type="submit" class="btn primary">Add Product</button>

        </form>
    </div>

</div>

</body>
</html>
