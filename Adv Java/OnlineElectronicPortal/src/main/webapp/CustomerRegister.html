<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="customerRegister.css">
</head>
<body>

    <div class="container">
        <div class="register-card">
            <h2>Create Account</h2>
            <p class="subtitle">Enter your personal details</p>

            <form action="cusReg" method="post">

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="uname" placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="pass" placeholder="Enter password" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" name="fname" placeholder="First name" required>
                    </div>

                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" name="lname" placeholder="Last name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <input type="text" name="addr" placeholder="Enter address" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="mail" placeholder="Enter email" required>
                </div>

                <div class="form-group">
                    <label>Mobile</label>
                    <input type="tel" name="mobile" placeholder="Enter mobile number" required pattern="[0-9]{10}">
                </div>

                <button type="submit" class="btn">Register</button>

            </form>
        </div>
    </div>

</body>
</html>
